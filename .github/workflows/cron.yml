name: Hourly Scraper
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-anapec:
    runs-on: ubuntu-latest
    steps:
      - name: Scrape ANAPEC jobs
        run: curl -sS -m 30 "https://atlasconcours.vercel.app/api/cron-scraper?source=anapec"

  scrape-jobs:
    runs-on: ubuntu-latest
    needs: scrape-anapec
    steps:
      - name: Scrape Emploi-Public jobs
        run: curl -sS -m 30 "https://atlasconcours.vercel.app/api/cron-scraper?source=jobs"

  scrape-concours:
    runs-on: ubuntu-latest
    needs: scrape-jobs
    steps:
      - name: Scrape Emploi-Public concours
        run: curl -sS -m 30 "https://atlasconcours.vercel.app/api/cron-scraper?source=concours"
