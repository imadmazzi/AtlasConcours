services:
  # =============================================
  # AtlasConcours — Single Web Service on Render
  # =============================================
  - type: web
    name: atlasconcours
    env: node
    region: frankfurt   # Closest to Morocco
    plan: free          # 100% FREE Tier!
    branch: main
    rootDir: .

    # Build: install all deps + compile React frontend into /public
    buildCommand: |
      npm install &&
      cd frontend && npm install && npm run build &&
      cp -r frontend/dist/* public/

    # Start: run the Express backend (which serves the built frontend + /api)
    startCommand: node server/index.js

    # Health check endpoint
    healthCheckPath: /api/stats

    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000         # Render assigns this port automatically
      - key: RUN_SCRAPER_ON_START
        value: false
      # Set these in Render Dashboard → Environment:
      # - key: MONGODB_URI       → Your Free MongoDB Atlas Connection String
      # - key: JWT_SECRET        → generate a secure random string
      # - key: GEMINI_API_KEY    → your Google AI key
